<!DOCTYPE html>
<html lang="mn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>08 - Даалгавар</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="page">
  <div class="card">
    <h1 class="title">Тооны машин</h1>
    <input class="input first-input" type="number" placeholder="Эхний тоо">
    <input class="input second-input" type="number" placeholder="Хоёр дахь тоо">
    <div class="buttons">
      <button class="button add-button">+</button>
      <button class="button subtract-button">-</button>
      <button class="button multiply-button">×</button>
      <button class="button divide-button">÷</button>
    </div>
    <p class="result">Хариу: ?</p>
  </div>

  <script src="script.js"></script>
</body>
</html>
