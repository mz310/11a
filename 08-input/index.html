<!DOCTYPE html>
<html lang="mn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>08 - Хэрэглэгчээс утга авах</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="page">
  <div class="card">
    <h1 class="title">Танилцъя</h1>
    <input class="input name-input" type="text" placeholder="Нэрээ бич">
    <button class="button greet-button">Мэндлэх</button>
    <p class="greeting">Нэрээ бичээд товчийг дар</p>
  </div>

  <div class="card">
    <h1 class="title">Хоёр тооны нийлбэр</h1>
    <input class="input first-input" type="number" placeholder="Эхний тоо">
    <input class="input second-input" type="number" placeholder="Хоёр дахь тоо">
    <button class="button sum-button">Нэмэх</button>
    <p class="sum-result">= ?</p>
  </div>

  <script src="script.js"></script>

</html>
